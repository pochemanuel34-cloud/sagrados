function exportar(t){const P=pagos(),m=($('m-'+t)||{}).value||'',im=x=>m&&F(x).startsWith(m),Rc=Object.values(caja.retiros||{}),Rp=Object.values(comp.retiros||{}),

function importar(ev){
  const f=ev.target.files[0];if(!f)return;ev.target.value='';$('cnt').textContent='Leyendo Excel...';
  const rd=new FileReader();
  rd.onload=x=>setTimeout(()=>{
    const wb=XLSX.read(x.target.result,{type:'array'});
    const normalizarCat=val=>{
      if(!val)return null;
      const str=String(val).toLowerCase().trim().replace(/[\/\s_]+/g,'-');
      if(str.includes('dama'))return'dama';
      if(str.includes('niñ')||str.includes('nino'))return'ninos';
      if(str.includes('caballero'))return'caballero';
      if(str.includes('calzado'))return'calzado';
      if(str.includes('sagrado'))return'sagrados';
      if(str.includes('accesorio')||str.includes('religioso'))return'accesorios-religioso';
      if(str.includes('perfume'))return'perfumes';
      if(str.includes('helado'))return'helados';
      return Object.keys(CATS).find(k=>CATS[k].toLowerCase()===str)||null;
    };
    const lote={};let n=0;
    wb.SheetNames.forEach(sn=>XLSX.utils.sheet_to_json(wb.Sheets[sn]).forEach(o=>{
      const g=(...keys)=>{
        for(let k of keys){if(o[k]!==undefined&&o[k]!==null)return String(o[k]).trim()}
        return '';
      };
      const refVal=g('Ref','Referencia'),nomVal=g('Nombre');
      if(!refVal&&!nomVal)return;
      const catLeida=g('Categoría','Categoria'),catFinal=normalizarCat(catLeida)||normalizarCat(sn)| me||'dama';
      const es=g('Estado').toLowerCase();
      lote[push(dbr('inventario')).key]={
        categoria:catFinal,
        codigo:g('Código','Codigo')||sigCodigo(),
        referencia:refVal,
        nombre:nomVal,
        color:g('Color','Color/Sabor'),
        marca:g('Marca'),
        talla:g('Talla','Talla/Detalle'),
        precio:parseFloat(o['Precio'])||0,
        estado:['sucia','vendida'].includes(es)?es:'disponible',
        marcado:false,
        tipoPago:'inmediato'
      };
      n++;
    }));
    if(!n){render();return alert('No se encontraron productos en el Excel')}
    upd(dbr('inventario'),lote).then(()=>alert('Productos importados exitosamente: '+n));
  },30);
  rd.readAsArrayBuffer(f);
}
